access_profiles:
  file: /etc/ttl-lama/access-profiles.yml
app:
  debug: true
  environment: development
  log_level: info
  secret_key_file: /run/secrets/flask_secret_key
auth:
  admin:
    password: admin
    username: admin
  allowed_origins: []
  cookie_name: ttl-lama_session
  mode: internal
  oidc:
    client_id: your_client_id
    client_secret_file: /run/secrets/oidc_client_secret
    issuer: your_issuer_url
    redirect_uri: /auth/callback
  password_hasher:
    hash_len: 32
    memory_cost: 65536
    parallelism: 4
    salt_len: 16
    time_cost: 3
  success_redirect: your_auth_success_redirect_url
database:
  path: /data/ttl-lama.db
  schema: public
  type: sqlite
security:
  enforce_secure_connection: false
  session_cookie_httponly: true
  session_cookie_name: session
  session_cookie_path: /
  session_cookie_samesite: Lax
  session_cookie_secure: false
  session_lifetime: 3600
server:
  host: 0.0.0.0
  port: 8080

