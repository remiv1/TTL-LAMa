app:
  environment: development
  debug: true
  secret_key_file: /run/secrets/flask_secret_key # or secret_key: your_secret_key
  log_level: info

server:
  host: 0.0.0.0
  port: 8080

auth:
  mode: internal
  cookie_name: ttl-lama_session
  admin:
    username: admin
    password: admin
  oidc:
    issuer: http://127.0.0.1:5556/dex
    client_id: ttl-lama-dex
    client_secret: ttl-lama-test-secret # or client_secret_file: /run/secrets/oidc_client_secret
    redirect_uri: http://127.0.0.1:8080/auth/callback
  success_redirect: http://127.0.0.1:8080/
  allowed_origins: []
  password_hasher:
    time_cost: 3
    memory_cost: 65536 # 64 MiB
    parallelism: 4
    hash_len: 32
    salt_len: 16
  max_connect_retry: 3
  login_lock_duration_seconds: 900

database:
  type: sqlite
  path: /data/ttl-lama.db
  schema: public

security:
  enforce_secure_connection: false
  session_cookie_name: session
  session_cookie_httponly: true
  session_cookie_secure: false
  session_cookie_samesite: Lax
  session_cookie_path: /
  session_lifetime: 3600

backend_config:
  file: /etc/ttl-lama/backend_config.yml

panic:
  mode: on_error
  retry: 3
  script: /etc/ttl-lama/panic_script.sh
  notify: true
  mail:
    send: true
    to: admin@example.com
    subject: Panic Alert
    body: |
      A panic event has occurred.
      Please check the logs and take necessary actions.
    config_file: /etc/ttl-lama/panic_mail_config.yml
    secret_file: /run/secrets/panic_mail_secret