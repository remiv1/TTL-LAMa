[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:api]
command=src/start-api.sh
directory=/opt/ttl-lama
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true

stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/python -m scheduler.main
directory=/opt/ttl-lama
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true

stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0