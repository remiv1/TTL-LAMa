<section class="page-heading">
    <p class="eyebrow">{{ text.authentication }}</p>
    <h1 id="page-title">{{ text.login_title }}</h1>
    <p>{{ text.login_copy }}</p>
</section>
<form class="login-panel" action="{{ url_for('auth.internal_login') }}" method="post" hx-boost="false">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if error == 'invalid' %}
        <p class="form-error" role="alert">{{ text.invalid_login }}</p>
    {% endif %}
    <label class="form-field">
        <span>{{ text.username }}</span>
        <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label class="form-field">
        <span>{{ text.password }}</span>
        <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="primary-action" type="submit">{{ text.submit_login }}</button>
</form>
