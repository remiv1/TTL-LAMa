issuer: http://dex:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

telemetry:
  http: 0.0.0.0:5558

grpc:
  http: 0.0.0.0:5557

sessions:
  cookieName: "dex_session"
  absoluteLifeTime: "24h"
  validIfNotUsedFor: "1h"

oauth2:
  grantTypes:
    - "authorization_code"
    - "refresh_token"
    - "client_credentials"
    - "urn:ietf:params:oauth:grant-type:device_code"
    - "urn:ietf:params:oauth:grant-type:token_exchange"
    - "password"
  passwordConnector: local

staticClients:
- id: ttl-lama-dex
  redirectURIs:
  - 'http://127.0.0.1:5555/auth/callback'
  - '/dex/device/callback'
  postLogoutRedirectURIs:
  - 'http://127.0.0.1:5555/'
  backchannelLogoutURI: 'http://127.0.0.1:5555/backchannel-logout'
  name: 'Example App'
  secret: ttl-lama-test-secret

enablePasswordDB: true

staticPasswords:
- email: "admin@example.com"
  # bcrypt hash of the string "password": $(echo password | htpasswd -BinC 10 admin | cut -d: -f2)
  hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
  username: "admin"
  name: "Admin User"
  emailVerified: true
  preferredUsername: "admin"
  groups:
  - "team-a"
  - "team-a/admins"
  userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"

signer:
  type: local
  config:
    keysRotationPeriod: "6h"
    algorithm: "RS256"