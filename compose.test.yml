services:
  postgres:
    container_name: postgres
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ttl_lama_test
      POSTGRES_USER: ttl_lama_test
      POSTGRES_PASSWORD: test-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttl_lama_test -d ttl_lama_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  mariadb:
    container_name: mariadb
    image: docker.io/library/mariadb:11.4
    environment:
      MARIADB_DATABASE: ttl_lama_test
      MARIADB_ROOT_PASSWORD: test-only-password
      MARIADB_ROOT_HOST: "%"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "healthcheck.sh --connect --innodb_initialized",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  mysql:
    container_name: mysql
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_DATABASE: ttl_lama_test
      MYSQL_ROOT_PASSWORD: test-only-password
      MYSQL_ROOT_HOST: "%"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -ptest-only-password",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    
  dex:
    container_name: dex
    image: docker.io/dexidp/dex:v2.46.1-alpine
    command: ["dex", "serve", "/etc/dex/cfg/config.yaml"]
    environment:
      DEX_CONFIG: /etc/dex/cfg/config.yaml
      DEX_SESSIONS_ENABLED: "true"
    volumes:
      - ./src/dex/config.yaml:/etc/dex/cfg/config.yaml:ro,z
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5556/dex/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  tests:
    container_name: tests
    build:
      context: .
      dockerfile: src/Dockerfile
      target: test
    environment:
      TTL_LAMA_CONFIG_FILE: /dev/null
      TTL_LAMA_TEST_DATABASES: sqlite,postgresql,mariadb,mysql
      TTL_LAMA_TEST_POSTGRESQL_URL: postgresql+psycopg://ttl_lama_test:test-only-password@postgres:5432/ttl_lama_test
      TTL_LAMA_TEST_MARIADB_URL: mariadb+pymysql://root:test-only-password@mariadb:3306/ttl_lama_test
      TTL_LAMA_TEST_MYSQL_URL: mysql+pymysql://root:test-only-password@mysql:3306/ttl_lama_test
    depends_on:
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      mysql:
        condition: service_healthy
      dex:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-v", "--color=yes", "-ra", "-p", "no:cacheprovider"]
